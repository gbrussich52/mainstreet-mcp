faqs:
  - question: "Do you take walk-ins?"
    answer: "Yes, we hold about a third of our tables for walk-ins every night, but reservations are recommended on weekends."
    tags: ["reservations", "walk-in"]
  - question: "Is there parking?"
    answer: "Free lot parking is available behind the building, entrance on Depew Street."
    tags: ["parking"]
  - question: "Do you have gluten-free options?"
    answer: "Yes — several dishes are marked gluten-free on the menu, and our kitchen can adapt most others on request."
    tags: ["dietary", "gluten-free", "allergen"]

