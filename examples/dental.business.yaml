faqs:
  - question: "Do you see new patients?"
    answer: "Yes, we're accepting new patients of all ages; call or use the online booking link to schedule a first visit."
    tags: ["new-patient"]
  - question: "What should I bring to my first appointment?"
    answer: "Please bring a photo ID and your insurance card if you have one; arrive 15 minutes early to fill out paperwork."
    tags: ["first-visit"]
  - question: "Do you handle dental emergencies?"
    answer: "Yes, call the office line — we hold same-day slots for urgent issues like pain or a broken tooth."
    tags: ["emergency"]

staff:
  - name: "Dr. Amir Kessler, DDS"
    role: "General Dentist"
    bio: "Practicing family dentistry in Westchester County for 15 years."
    credentials: ["DDS"]
  - name: "Dr. Priya Nair, DDS"
